services:
  api:
    image: api-prontomed
    container_name: api-prontomed
    build:
      context: ./api
      dockerfile: Dockerfile.dev
    env_file: [./api/.env]
    environment:
      # Dentro da rede o banco atende por `database:5432`; do host, por
      # `localhost:5433` (5432 fica com outro stack Postgres da máquina).
      - POSTGRES_HOST=database
      - POSTGRES_PORT=5432
    volumes:
      - ./api:/usr/src/app
      # Preserva o node_modules da imagem, que o bind acima sobreporia.
      # `dist/` NÃO leva volume anônimo: `deleteOutDir: true` faria rmdir num ponto
      # de montagem e o boot morreria com EBUSY. Quem resolve o dono do artefato é o
      # `USER node` do Dockerfile.dev.
      - /usr/src/app/node_modules
    ports: ['3333:3333']
    depends_on:
      database:
        condition: service_healthy
    networks: [prontomed-net]

  k6:
    image: grafana/k6:latest
    container_name: k6-prontomed
    # **Sobe sempre, junto com o resto.** É POC avaliada localmente: um único
    # `docker compose up -d` deixa tudo pronto e disponível, e quem avalia não precisa
    # saber que existe `--profile`, nem buildar ou puxar imagem em passo separado.
    #
    # `entrypoint` sobrescrito porque a imagem do k6 é uma **CLI**, não um servidor: o
    # entrypoint dela é o próprio binário, e o `command` natural seria
    # `run /scripts/stress-test.js`. Do jeito natural, o container executaria o teste
    # de estresse **no boot** — contra um banco que ainda nem rodou as migrations — e
    # morreria com erro, deixando um `Exited (99)` na cara de quem acabou de subir o
    # projeto. Aqui ele fica ocioso e a ferramenta é acionada por
    # `npm run test:stress`, que faz `docker exec` neste container. Disponível não é
    # a mesma coisa que disparado.
    entrypoint: ['sleep', 'infinity']
    volumes: ['./api/test/stress:/scripts']
    environment:
      # Endereço **de dentro da rede** — o k6 fala com `api:3333`, não com o
      # `localhost:3333` do host. O prefixo `/api` é o global de `app.setup.ts:15`.
      - API_URL=http://api:3333/api
    depends_on: [api]
    networks: [prontomed-net]

  database:
    image: postgres:16-alpine
    container_name: db-prontomed
    # Fonte única das credenciais: POSTGRES_USER/PASSWORD/DB vêm do mesmo .env da api.
    env_file: [./api/.env]
    ports: ['5433:5432']
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./api/db/init-test-db.sh:/docker-entrypoint-initdb.d/init-test-db.sh
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB']
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [prontomed-net]

networks:
  prontomed-net:
    driver: bridge

volumes:
  pgdata:
